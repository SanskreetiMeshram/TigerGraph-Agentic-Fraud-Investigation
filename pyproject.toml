[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caseguard-tigergraph-fraud"
version = "1.0.0"
description = "CaseGuard: TigerGraph Agentic Fraud Investigation & Next-Best Action"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "gdown>=5.1.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.server:app"
